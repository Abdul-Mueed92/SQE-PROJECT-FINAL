name: SQE payment regression proof

on:
  pull_request:
    branches: [sqe-proof-base]

permissions:
  contents: read

jobs:
  payment-regression:
    name: Payment API regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, ctype, dom, fileinfo, intl, gd, mbstring, pdo_sqlite, sqlite, xml, zip
          coverage: none
      - name: Install dependencies
        run: |
          cp .env.testing .env
          composer install --no-interaction --prefer-dist
      - name: Run the API regression tests
        run: |
          mkdir -p sqe-proof
          php vendor/bin/phpunit tests/Feature/Api/CoreApiLifecycleTest.php tests/Feature/Team \
            --log-junit sqe-proof/payment-api-junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payment-api-proof
          path: sqe-proof/
