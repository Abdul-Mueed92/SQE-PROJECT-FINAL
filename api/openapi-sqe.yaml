openapi: 3.0.3
info:
  title: Akaunting invoice and payment test contract
  version: 1.0.0
  description: JSON workflows on the seeded SQE company. `x-sqe-*` entries define executable fixtures and partitions for the generator.
servers:
  - url: http://127.0.0.1:8765/api
security:
  - basic: []
paths:
  /documents:
    post:
      operationId: createInvoice
      parameters:
        - { $ref: '#/components/parameters/InvoiceSearch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoiceCreate' }
      responses:
        '201': {description: Invoice created}
        '401': {description: Authentication required}
        '403': {description: Permission denied}
        '422': {description: Invoice validation failed}
  /documents/{document}:
    get:
      operationId: readInvoice
      parameters:
        - {name: document, in: path, required: true, schema: {type: integer}}
        - { $ref: '#/components/parameters/InvoiceSearch' }
      responses:
        '200': {description: Invoice including linked transactions}
        '404': {description: Invoice unavailable}
  /documents/{document}/transactions:
    parameters:
      - {name: document, in: path, required: true, schema: {type: integer}}
    get:
      operationId: listInvoicePayments
      responses:
        '200': {description: Linked transactions}
    post:
      operationId: recordInvoicePayment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentCreate' }
      responses:
        '201': {description: Payment recorded}
        '401': {description: Authentication required}
        '403': {description: Permission denied}
        '422': {description: Invalid payment or amount exceeding the balance}
        '500': {description: Unexpected processing failure}
components:
  parameters:
    InvoiceSearch:
      name: search
      in: query
      required: true
      schema: {type: string, enum: ['type:invoice']}
      description: Selects the sales-invoice permission group in the live HTTP server.
  securitySchemes:
    basic: {type: http, scheme: basic}
  schemas:
    InvoiceCreate:
      type: object
      required: [type, document_number, status, issued_at, due_at, amount, currency_code, currency_rate, contact_id, contact_name, category_id]
      properties:
        type:
          type: string
          example: invoice
          x-sqe-partitions: {wrong-type: {value: 123, status: 422}}
        document_number:
          type: string
          minLength: 1
          x-sqe-partitions: {wrong-type: {value: 123, status: 422}}
        status:
          type: string
          minLength: 1
          x-sqe-partitions: {wrong-type: {value: 123, status: 422}}
        issued_at:
          type: string
          example: '2026-11-01 12:00:00'
          x-sqe-date-limit: {value: '2026-11-30 12:00:00', inclusive: before}
          x-sqe-partitions: {unparseable: {value: invalid-date, status: 422}}
        due_at:
          type: string
          example: '2026-11-30 12:00:00'
          x-sqe-date-limit: {value: '2026-11-01 12:00:00', inclusive: after}
          x-sqe-partitions: {unparseable: {value: invalid-date, status: 422}}
        amount:
          type: number
          description: Required in the request. The stored amount is calculated from invoice lines.
          example: 10
        currency_code:
          type: string
          example: USD
          x-sqe-partitions: {unknown: {value: ZZZ, status: 422}}
        currency_rate:
          type: number
          minimum: 0
          exclusiveMinimum: true
          example: 1
        contact_id:
          type: integer
          x-sqe-partitions: {missing-record: {value: 999999, status: 422}, wrong-type: {value: invalid, status: 422}}
        contact_name:
          type: string
          minLength: 1
          x-sqe-partitions: {wrong-type: {value: 123, status: 422}}
        category_id:
          type: integer
          x-sqe-partitions: {missing-record: {value: 999999, status: 422}, wrong-type: {value: invalid, status: 422}}
        items:
          type: array
          items:
            type: object
            required: [name, quantity, price]
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 255
                x-sqe-partitions: {wrong-type: {value: 123, status: 422}}
              quantity:
                type: string
                description: Calculation expression. FormRequest applies a representation-dependent max rule.
                example: '2*3'
                x-sqe-partitions: {invalid-expression: {value: invalid, status: 422}}
              price:
                type: number
                minimum: 0
                exclusiveMinimum: true
                example: 12.34
    PaymentCreate:
      type: object
      required: [type, number, account_id, paid_at, amount, currency_code, currency_rate, category_id, payment_method]
      properties:
        type:
          type: string
          example: income
          x-sqe-partitions: {wrong-type: {value: 123, status: 422}}
        number:
          type: string
          minLength: 1
          x-sqe-partitions: {wrong-type: {value: 123, status: 422}}
        account_id:
          type: integer
          x-sqe-partitions: {missing-record: {value: 999999, status: 422}, wrong-type: {value: invalid, status: 422}}
        paid_at:
          type: string
          example: '2026-11-15 12:00:00'
          x-sqe-partitions: {unparseable: {value: invalid-date, status: 422}}
        amount:
          type: number
          minimum: 0
          maximum: 100
          description: Maximum is dynamic. The seeded invoice starts with a balance of 100 USD.
          example: 25.50
        currency_code:
          type: string
          example: USD
          x-sqe-partitions: {unknown: {value: ZZZ, status: 422}}
        currency_rate:
          type: number
          minimum: 0
          exclusiveMinimum: true
          example: 1
        contact_id:
          type: integer
          nullable: true
          x-sqe-partitions: {null: {value: null, status: 201}, missing-record: {value: 999999, status: 422}}
        category_id:
          type: integer
          x-sqe-partitions: {missing-record: {value: 999999, status: 422}, wrong-type: {value: invalid, status: 422}}
        payment_method:
          type: string
          x-sqe-partitions: {unknown: {value: unknown, status: 422}}
